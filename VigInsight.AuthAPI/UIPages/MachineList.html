<body>

                </a>
                <a href="javascript:void(0);" class="layout-menu-toggle menu-link text-large ms-auto d-block d-xl-none">
                    <i class="bx bx-chevron-left bx-sm align-middle"></i>
                </a>
            </div>
            <div class="menu-inner-shadow"></div>
            <ul class="menu-inner py-1">
                <li class="menu-item"><a href="AdminDashboard.html" class="menu-link"><i class="menu-icon tf-icons bx bx-grid-alt"></i><div>Admin Dashboard</div></a></li>
                <li class="menu-item"><a href="UserList.html" class="menu-link"><i class="menu-icon tf-icons bx bx-group"></i><div>Users</div></a></li>
                <li class="menu-item active"><a href="MachineList.html" class="menu-link"><i class="menu-icon tf-icons bx bx-chip"></i><div>Machines</div></a></li>
                <li class="menu-item"><a href="OrganizationList.html" class="menu-link"><i class="menu-icon tf-icons bx bx-buildings"></i><div>Organizations</div></a></li>
            </ul>
        </aside>
        <!-- /Sidebar -->
        <div class="layout-page">
            <nav class="layout-navbar container-xxl navbar navbar-expand-xl navbar-detached align-items-center bg-navbar-theme" id="layout-navbar">
                <div class="layout-menu-toggle navbar-nav align-items-xl-center me-3 me-xl-0 d-xl-none">
                    <a class="nav-item nav-link px-0 me-xl-4" href="javascript:void(0)"><i class="bx bx-menu bx-sm"></i></a>
                </div>
                <div class="navbar-nav-right d-flex align-items-center" id="navbar-collapse">
                    <div class="navbar-nav align-items-center">
                        <div class="nav-item d-flex align-items-center">
                            <i class="bx bx-search fs-4 lh-0"></i>
                            <input type="text" id="searchInput" class="form-control border-0 shadow-none"
                                   placeholder="Search machines..." oninput="filterTable()" />
                        </div>
                    </div>
                    <ul class="navbar-nav flex-row align-items-center ms-auto">
                        <li class="nav-item navbar-dropdown dropdown-user dropdown">
                            <a class="nav-link dropdown-toggle hide-arrow" href="javascript:void(0);" data-bs-toggle="dropdown">
                                <div class="avatar avatar-online"><img src="./assets/img/avatars/1.png" alt class="w-px-40 h-auto rounded-circle" /></div>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="index.html" onclick="localStorage.removeItem('user')"><i class="bx bx-power-off me-2"></i>Log Out</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </nav>
            <div class="content-wrapper">
                <div class="container-xxl flex-grow-1 container-p-y">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center py-3">
                            <h5 class="mb-0"><i class="bx bx-chip me-2 text-warning"></i>Machine Management</h5>
                            <button class="btn btn-primary btn-sm" id="btnAddMachine" onclick="openAddModal()">
                                <i class="bx bx-plus me-1"></i>Add New Machine
                            </button>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0" id="machineTable">
                                    <thead class="table-light">
                                        <tr>
                                            <th>#</th>
                                            <th>Machine Name</th>
                                            <th>Description</th>
                                            <th>Organization</th>
                                            <th>Status</th>
                                            <th>Created</th>
                                            <th class="text-center" id="actionsHeader">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="machineTableBody">
                                        <tr><td colspan="7" class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="card-footer d-flex justify-content-between align-items-center">

                            <nav><ul class="pagination pagination-sm mb-0" id="pagination"></ul></nav>
                        </div>
                    </div>
                </div>
                <footer class="content-footer footer bg-footer-theme">
                    <div class="container-xxl py-2">
                        <div>� <script>document.write(new Date().getFullYear())</script>, made by <a href="https://www.vignanelectronics.com/" target="_blank" class="footer-link fw-bolder">Vignan Electronics</a></div>
                    </div>
                </footer>
                <div class="content-backdrop fade"></div>
            </div>
        </div>
    </div>
    <div class="layout-overlay layout-menu-toggle"></div>
</div>

<!-- Add / Edit Modal -->
<div class="modal fade" id="machineModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add Machine</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="machineForm" autocomplete="off">
                    <input type="hidden" id="editMachineId" value="0" />
                    <div class="mb-3">
                        <label class="form-label">Machine Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="fMachineName" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="fMachineDescription" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Organization <span class="text-danger">*</span></label>
                        <select class="form-select" id="fOrganizationId" required>
                            <option value="">Select Organization</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="fIsActive">
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>
                    <div id="formError" class="alert alert-danger d-none"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="btnSave" onclick="saveMachine()">
                    <span id="btnSaveText">Save</span>
                    <span id="btnSaveSpinner" class="spinner-border spinner-border-sm d-none ms-1"></span>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-body text-center py-4">
                <i class="bx bx-trash text-danger" style="font-size:3rem;"></i>
                <h5 class="mt-2">Delete Machine?</h5>
                <p class="text-muted mb-0" id="deleteMachineName"></p>
            </div>
            <div class="modal-footer justify-content-center border-0 pt-0">
                <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-danger btn-sm" id="btnConfirmDelete" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>
</div>

<script src="./assets/vendor/libs/jquery/jquery.js"></script>
<script src="./assets/vendor/libs/popper/popper.js"></script>
<script src="./assets/vendor/js/bootstrap.js"></script>
<script src="./assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
<script src="./assets/vendor/js/menu.js"></script>
<script src="./assets/js/main.js"></script>
<script>
// ?? Auth guard ????????????????????????????????????????????????
(function () {
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (!user) { window.location.href = 'index.html'; }
})();

const API = 'https://localhost:7039';
let allMachines = [], allOrgs = [];
let currentPage = 1;
const pageSize = 10;
let deleteTargetId = 0;

// ?? Normalise role from localStorage ?????????????????????????
const currentUser = JSON.parse(localStorage.getItem('user') || '{}');
const _role    = (currentUser.role || currentUser.roleName || '').toLowerCase();
const isAdmin  = _role === 'admin';
const isClient = _role === 'client';
const canWrite = isAdmin || isClient;

document.addEventListener('DOMContentLoaded', async () => {
    if (!canWrite) {
        document.getElementById('btnAddMachine').classList.add('d-none');
        document.getElementById('actionsHeader').classList.add('d-none');
    }
    await loadOrganizations();
    await loadMachines();
});

async function loadMachines() {
    try {
        const qs = currentUser.userId
            ? `?userId=${currentUser.userId}&role=${currentUser.roleName || currentUser.role || 'Admin'}`
            : '';
        const res = await fetch(`${API}/api/Machine${qs}`);
        if (!res.ok) throw new Error(await res.text());
        allMachines = await res.json();
        currentPage = 1;
        renderTable();
        renderPagination();
    } catch (err) { showTableError(err.message); }
}

async function loadOrganizations() {
    try {
        const res = await fetch(`${API}/api/Organization`);
        if (!res.ok) return;
        allOrgs = await res.json();
        const sel = document.getElementById('fOrganizationId');
        sel.innerHTML = '<option value="">Select Organization</option>';
        allOrgs.forEach(o => sel.insertAdjacentHTML('beforeend', `<option value="${o.organizationId}">${o.organizationName}</option>`));
    } catch {}
}

function orgName(orgId) {
    const o = allOrgs.find(x => x.organizationId === orgId);
    return o ? o.organizationName : (orgId || '�');
}

function filteredMachines() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    if (!q) return allMachines;
    return allMachines.filter(m =>
        (m.machineName || '').toLowerCase().includes(q) ||
        (m.organizationName || orgName(m.organizationId) || '').toLowerCase().includes(q) ||
        (m.machineDescription || '').toLowerCase().includes(q)
    );
}

function filterTable() { currentPage = 1; renderTable(); renderPagination(); }

function renderTable() {
    const data  = filteredMachines();
    const start = (currentPage - 1) * pageSize;
    const rows  = data.slice(start, start + pageSize);
    const tbody = document.getElementById('machineTableBody');
    document.getElementById('recordCount').textContent =
        `Showing ${start + 1}�${Math.min(start + pageSize, data.length)} of ${data.length} machines`;

    if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">No machines found.</td></tr>`;
        return;
    }

    tbody.innerHTML = rows.map((m, i) => `
        <tr>
            <td><span class="text-muted small">${start + i + 1}</span></td>
            <td><span class="fw-semibold">${m.machineName}</span></td>
            <td><small class="text-muted">${m.machineDescription || '�'}</small></td>
            <td>${m.organizationName || orgName(m.organizationId) || '�'}</td>
            <td>${m.isActive
                ? '<span class="badge bg-label-success">Active</span>'
                : '<span class="badge bg-label-secondary">Inactive</span>'}</td>
            <td><small class="text-muted">${m.createdOn ? new Date(m.createdOn).toLocaleDateString() : '�'}</small></td>
            <td class="text-center">
                ${canWrite ? `
                <button class="btn btn-sm btn-icon btn-outline-primary me-1" title="Edit" onclick="openEditModal(${m.machineId})">
                    <i class="bx bx-edit-alt"></i>
                </button>
                <button class="btn btn-sm btn-icon btn-outline-danger" title="Delete" onclick="openDeleteModal(${m.machineId}, '${m.machineName}')">
                    <i class="bx bx-trash"></i>
                </button>` : '<span class="text-muted small">�</span>'}
            </td>
        </tr>`).join('');
}

function renderPagination() {
    const total = Math.ceil(filteredMachines().length / pageSize);
    const pag = document.getElementById('pagination');
    pag.innerHTML = '';
    for (let i = 1; i <= total; i++) {
        pag.insertAdjacentHTML('beforeend', `
            <li class="page-item ${i === currentPage ? 'active' : ''}">
                <a class="page-link" href="#" onclick="event.preventDefault();currentPage=${i};renderTable();renderPagination()">${i}</a>
            </li>`);
    }
}

function openAddModal() {
    document.getElementById('editMachineId').value = '0';
    document.getElementById('modalTitle').textContent = 'Add New Machine';
    document.getElementById('machineForm').reset();
    document.getElementById('formError').classList.add('d-none');
    new bootstrap.Modal(document.getElementById('machineModal')).show();
}

function openEditModal(machineId) {
    const m = allMachines.find(x => x.machineId === machineId);
    if (!m) return;
    document.getElementById('editMachineId').value       = machineId;
    document.getElementById('modalTitle').textContent    = 'Edit Machine';
    document.getElementById('fMachineName').value        = m.machineName;
    document.getElementById('fMachineDescription').value = m.machineDescription || '';
    document.getElementById('fOrganizationId').value     = m.organizationId || '';
    document.getElementById('fIsActive').value           = m.isActive ? 'true' : 'false';
    document.getElementById('formError').classList.add('d-none');
    new bootstrap.Modal(document.getElementById('machineModal')).show();
}

async function saveMachine() {
    const editId  = parseInt(document.getElementById('editMachineId').value);
    const isEdit  = editId > 0;
    const name    = document.getElementById('fMachineName').value.trim();
    const desc    = document.getElementById('fMachineDescription').value.trim();
    const orgId   = parseInt(document.getElementById('fOrganizationId').value || '0');
    const active  = document.getElementById('fIsActive').value === 'true';

    if (!name)  { showFormError('Machine name is required.'); return; }
    if (!orgId) { showFormError('Please select an organization.'); return; }

    setSaving(true);
    try {
        const now = new Date().toISOString();
        let res;
        if (isEdit) {
            const body = { machine: { machineId: editId, machineName: name, machineDescription: desc, isActive: active, modifiedBy: currentUser.username || 'admin', modifiedOn: now }, organizationId: orgId };
            res = await fetch(`${API}/api/Machine/${editId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        } else {
            const body = { machine: { machineName: name, machineDescription: desc, isActive: active, createdBy: currentUser.username || 'admin', createdOn: now }, organizationId: orgId };
            res = await fetch(`${API}/api/Machine`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        }
        if (!res.ok) { showFormError(await res.text()); return; }
        bootstrap.Modal.getInstance(document.getElementById('machineModal')).hide();
        await loadMachines();
        showToast(isEdit ? 'Machine updated successfully.' : 'Machine added successfully.', 'success');
    } catch (err) {
        showFormError('Network error: ' + err.message);
    } finally {
        setSaving(false);
    }
}

function openDeleteModal(machineId, name) {
    deleteTargetId = machineId;
    document.getElementById('deleteMachineName').textContent = name;
    new bootstrap.Modal(document.getElementById('deleteModal')).show();
}

async function confirmDelete() {
    document.getElementById('btnConfirmDelete').disabled = true;
    try {
        const res = await fetch(`${API}/api/Machine/${deleteTargetId}`, { method: 'DELETE' });
        if (!res.ok) throw new Error(await res.text());
        bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
        await loadMachines();
        showToast('Machine deleted successfully.', 'danger');
    } catch (err) {
        alert('Error: ' + err.message);
    } finally {
        document.getElementById('btnConfirmDelete').disabled = false;
    }
}

function showFormError(msg) {
    const d = document.getElementById('formError');
    d.textContent = msg; d.classList.remove('d-none');
}
function setSaving(on) {
    document.getElementById('btnSave').disabled = on;
    document.getElementById('btnSaveText').textContent = on ? 'Saving...' : 'Save';
    document.getElementById('btnSaveSpinner').classList.toggle('d-none', !on);
}
function showTableError(msg) {
    document.getElementById('machineTableBody').innerHTML =
        `<tr><td colspan="7" class="text-center text-danger py-4"><i class="bx bx-error me-1"></i>${msg}</td></tr>`;
}
function showToast(msg, type) {
    const t = document.createElement('div');
    t.className = `alert alert-${type} position-fixed bottom-0 end-0 m-3 shadow`;
    t.style.zIndex = 9999; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}
</script>
</body>
