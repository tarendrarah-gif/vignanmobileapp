<!DOCTYPE html>
<html lang="en"
      class="light-style layout-menu-fixed"
      dir="ltr"
      data-theme="theme-default"
      data-assets-path="./assets/"
      data-template="vertical-menu-template-free">
<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>Client Dashboard | Vignan</title>
    <link rel="icon" type="image/x-icon" href="./assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
          rel="stylesheet" />
    <link rel="stylesheet" href="./assets/vendor/fonts/boxicons.css" />
    <link rel="stylesheet" href="./assets/vendor/css/core.css"         class="template-customizer-core-css" />
    <link rel="stylesheet" href="./assets/vendor/css/theme-default.css" class="template-customizer-theme-css" />
    <link rel="stylesheet" href="./assets/css/demo.css" />
    <link rel="stylesheet" href="./assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css" />
    <link rel="stylesheet" href="./assets/vendor/libs/apex-charts/apex-charts.css" />
    <script src="./assets/vendor/js/helpers.js"></script>
    <script src="./assets/js/config.js"></script>
</head>

<body>
<div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">

        <!-- ── Sidebar ──────────────────────────────────────────── -->
        <aside id="layout-menu" class="layout-menu menu-vertical menu bg-menu-theme">
            <div class="app-brand demo">
                <a href="ClientDashboard.html" class="app-brand-link">
                    <img src="./assets/img/favicon/vignan.png" alt="Logo" style="max-width:80px;" />
                    <span class="app-brand-text demo menu-text fw-bolder">Vignan</span>
                </a>
                <a href="javascript:void(0);"
                   class="layout-menu-toggle menu-link text-large ms-auto d-block d-xl-none">
                    <i class="bx bx-chevron-left bx-sm align-middle"></i>
                </a>
            </div>
            <div class="menu-inner-shadow"></div>
            <!-- Menu items injected by JS -->
            <ul class="menu-inner py-1" id="sidebarMenu">
                <li class="menu-item active">
                    <a href="ClientDashboard.html" class="menu-link">
                        <i class="menu-icon tf-icons bx bx-home-circle"></i>
                        <div>Dashboard</div>
                    </a>
                </li>
            </ul>
        </aside>
        <!-- ── /Sidebar ─────────────────────────────────────────── -->

        <div class="layout-page">

            <!-- ── Navbar ───────────────────────────────────────── -->
            <nav class="layout-navbar container-xxl navbar navbar-expand-xl navbar-detached align-items-center bg-navbar-theme"
                 id="layout-navbar">
                <div class="layout-menu-toggle navbar-nav align-items-xl-center me-3 me-xl-0 d-xl-none">
                    <a class="nav-item nav-link px-0 me-xl-4" href="javascript:void(0)">
                        <i class="bx bx-menu bx-sm"></i>
                    </a>
                </div>
                <div class="navbar-nav-right d-flex align-items-center" id="navbar-collapse">
                    <!-- Welcome text -->
                    <div class="navbar-nav align-items-center">
                        <span class="text-muted ms-2 d-none d-sm-inline">
                            Welcome, <strong id="navWelcomeName"></strong>
                        </span>
                    </div>
                    <ul class="navbar-nav flex-row align-items-center ms-auto">
                        <!-- User dropdown -->
                        <li class="nav-item navbar-dropdown dropdown-user dropdown">
                            <a class="nav-link dropdown-toggle hide-arrow"
                               href="javascript:void(0);" data-bs-toggle="dropdown">
                                <div class="avatar avatar-online">
                                    <img src="./assets/img/avatars/1.png" alt
                                         class="w-px-40 h-auto rounded-circle" />
                                </div>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <a class="dropdown-item" href="#">
                                        <div class="d-flex">
                                            <div class="flex-shrink-0 me-3">
                                                <div class="avatar avatar-online">
                                                    <img src="./assets/img/avatars/1.png" alt
                                                         class="w-px-40 h-auto rounded-circle" />
                                                </div>
                                            </div>
                                            <div class="flex-grow-1">
                                                <span class="fw-semibold d-block navbar-username">User</span>
                                                <small class="text-muted navbar-role">Client</small>
                                            </div>
                                        </div>
                                    </a>
                                </li>
                                <li><div class="dropdown-divider"></div></li>
                                <li>
                                    <a class="dropdown-item" href="#">
                                        <i class="bx bx-user me-2"></i>
                                        <span class="align-middle">My Profile</span>
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="#">
                                        <i class="bx bx-cog me-2"></i>
                                        <span class="align-middle">Settings</span>
                                    </a>
                                </li>
                                <li><div class="dropdown-divider"></div></li>
                                <li>
                                    <a class="dropdown-item" href="index.html"
                                       onclick="localStorage.removeItem('user')">
                                        <i class="bx bx-power-off me-2"></i>
                                        <span class="align-middle">Log Out</span>
                                    </a>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </nav>
            <!-- ── /Navbar ──────────────────────────────────────── -->

            <!-- ── Content wrapper ──────────────────────────────── -->
            <div class="content-wrapper">
                <div class="container-xxl flex-grow-1 container-p-y">

                    <!-- Welcome banner -->
                    <div class="row">
                        <div class="col-12 mb-4">
                            <div class="card">
                                <div class="d-flex align-items-end row">
                                    <div class="col-sm-7">
                                        <div class="card-body">
                                            <h5 class="card-title text-primary">
                                                Welcome back, <span id="bannerUsername">there</span>! 🎉
                                            </h5>
                                            <p class="mb-1">
                                                <strong>Organisation:</strong>
                                                <span id="bannerOrgName" class="text-primary">—</span>
                                            </p>
                                            <p class="mb-0 text-muted">
                                                Empowering progress through AI‑enhanced decision intelligence.
                                            </p>
                                        </div>
                                    </div>
                                    <div class="col-sm-5 text-center">
                                        <div class="card-body pb-0 px-0 px-md-4">
                                            <img src="./assets/img/illustrations/ViganAI.png"
                                                 style="width:100%;" height="140" alt="Vignan AI" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Machine cards -->
                    <div class="row">
                        <div class="col-12">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="mb-0">
                                    <i class="bx bx-chip me-2 text-warning"></i>Your Machines
                                </h5>
                                <span id="machineCountBadge" class="badge bg-label-primary d-none"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Spinner shown while loading -->
                    <div id="machineSpinner" class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <div class="text-muted mt-2">Loading machines…</div>
                    </div>

                    <!-- Machine card grid (populated by JS) -->
                    <div class="row" id="divMachineContainer"></div>

                </div>

                <footer class="content-footer footer bg-footer-theme">
                    <div class="container-xxl d-flex flex-wrap justify-content-between py-2 flex-md-row flex-column">
                        <div class="mb-2 mb-md-0">
                            ©<script>document.write(new Date().getFullYear())</script>,
                            made by
                            <a href="https://www.vignanelectronics.com/" target="_blank"
                               class="footer-link fw-bolder">Vignan Electronics</a>
                        </div>
                    </div>
                </footer>
                <div class="content-backdrop fade"></div>
            </div>
            <!-- ── /Content wrapper ─────────────────────────────── -->

        </div>
    </div>
    <div class="layout-overlay layout-menu-toggle"></div>
</div>

<!-- ── Scripts ────────────────────────────────────────────────── -->
<script src="./assets/vendor/libs/jquery/jquery.js"></script>
<script src="./assets/vendor/libs/popper/popper.js"></script>
<script src="./assets/vendor/js/bootstrap.js"></script>
<script src="./assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
<script src="./assets/vendor/js/menu.js"></script>
<script src="./assets/vendor/libs/apex-charts/apexcharts.js"></script>
<script src="./assets/js/main.js"></script>
<script src="./assets/js/dashboards-analytics.js"></script>

<script>
// ── 1. Auth guard (runs immediately, before DOM) ──────────────────────────
(function () {
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (!user) { window.location.href = 'index.html'; return; }
    const role = (user.role || user.roleName || '').toLowerCase();
    if (role === 'admin') { window.location.href = 'AdminDashboard.html'; }
})();

const API = 'https://localhost:7039';

// ── 2. On DOM ready ───────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function () {
    const user        = JSON.parse(localStorage.getItem('user') || '{}');
    const username    = user.username    || 'User';
    const orgName     = user.organizationName || '';
    const role        = (user.role || user.roleName || '').toLowerCase();

    // ── Populate navbar & banner ──────────────────────────────────────────
    document.querySelectorAll('.navbar-username').forEach(el => el.textContent = username);
    document.querySelectorAll('.navbar-role').forEach(el =>
        el.textContent = user.role || user.roleName || 'Client');
    document.getElementById('navWelcomeName').textContent  = username;
    document.getElementById('bannerUsername').textContent  = username;
    document.getElementById('bannerOrgName').textContent   = orgName || '—';

    // ── Build sidebar based on role ───────────────────────────────────────
    const menu = document.getElementById('sidebarMenu');
    menu.innerHTML = `
        <li class="menu-item active">
            <a href="ClientDashboard.html" class="menu-link">
                <i class="menu-icon tf-icons bx bx-home-circle"></i>
                <div>Dashboard</div>
            </a>
        </li>`;

    if (role === 'client') {
        menu.insertAdjacentHTML('beforeend', `
            <li class="menu-item">
                <a href="UserList.html" class="menu-link">
                    <i class="menu-icon tf-icons bx bx-group"></i>
                    <div>Users</div>
                </a>
            </li>
            <li class="menu-item">
                <a href="MachineList.html" class="menu-link">
                    <i class="menu-icon tf-icons bx bx-chip"></i>
                    <div>Machines</div>
                </a>
            </li>`);
    }
    // "User" role → dashboard + machines only (read-only, no management links)

    // ── Load machines ─────────────────────────────────────────────────────
    loadMachines(user);
});

// ── 3. Load & render machine cards ───────────────────────────────────────
async function loadMachines(user) {
    const orgId    = user.organizationId;
    const spinner  = document.getElementById('machineSpinner');
    const container = document.getElementById('divMachineContainer');

    if (!orgId) {
        spinner.classList.add('d-none');
        container.innerHTML = `
            <div class="col-12">
                <div class="alert alert-warning">
                    <i class="bx bx-error-circle me-2"></i>
                    No organisation is linked to your account. Please contact your administrator.
                </div>
            </div>`;
        return;
    }

    try {
        const res = await fetch(`${API}/api/Machine/ByOrganization/${orgId}`);
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        const machines = await res.json();

        spinner.classList.add('d-none');

        // ── Count badge ───────────────────────────────────────────────────
        const badge = document.getElementById('machineCountBadge');
        badge.textContent = `${machines.length} machine${machines.length !== 1 ? 's' : ''}`;
        badge.classList.remove('d-none');

        if (!machines.length) {
            container.innerHTML = `
                <div class="col-12">
                    <div class="alert alert-info">
                        <i class="bx bx-info-circle me-2"></i>
                        No machines are assigned to your organisation yet.
                    </div>
                </div>`;
            return;
        }

        // ── Add machine sidebar links ─────────────────────────────────────
        const menu = document.getElementById('sidebarMenu');
        menu.insertAdjacentHTML('beforeend',
            `<li class="menu-header small text-uppercase">
                <span class="menu-header-text text-muted">Machines</span>
             </li>`);
        machines.forEach(m => {
            const li = document.createElement('li');
            li.className = 'menu-item';
            li.innerHTML = `
                <a href="MachineOverview.html?machineId=${m.machineId}"
                   class="menu-link" data-machine-id="${m.machineId}">
                    <i class="menu-icon tf-icons bx bx-collection"></i>
                    <div>${m.machineName}</div>
                </a>`;
            li.querySelector('a').addEventListener('click', () =>
                localStorage.setItem('machineId', m.machineId));
            menu.appendChild(li);
        });

        // ── Render machine cards ──────────────────────────────────────────
        container.innerHTML = '';
        machines.forEach(m => {
            let perfClass = 'bg-label-success', perfLabel = 'Excellent',
                perfIcon  = 'bx bx-happy-beaming',
                perfText  = 'All systems running smoothly.';

            if (m.performance === 'Moderate') {
                perfClass = 'bg-label-warning'; perfLabel = 'Moderate';
                perfIcon  = 'bx bx-error';
                perfText  = 'Some parameters need attention.';
            } else if (m.performance === 'Problem' || m.performance === 'Stopped') {
                perfClass = 'bg-label-danger'; perfLabel = 'Problem / Stopped';
                perfIcon  = 'bx bx-block';
                perfText  = 'Machine stopped or in error!';
            }

            const alertHtml = m.alert
                ? `<div class="alert alert-danger mt-2 mb-0 p-2" style="font-size:.875em;">
                       <i class="bx bx-bell me-1"></i>${m.alert}</div>` : '';

            const statusIcon = m.isOnline
                ? `<span class="badge bg-label-success"><i class="bx bxs-circle me-1"></i>Online</span>`
                : `<span class="badge bg-label-danger"><i class="bx bxs-circle me-1"></i>Offline</span>`;

            const hp  = m.hourlyProduction  != null ? m.hourlyProduction.toFixed(1)  : 'N/A';
            const pwr = m.powerConsumption  != null ? m.powerConsumption.toFixed(1)  : 'N/A';

            const col = document.createElement('div');
            col.className = 'col-xl-4 col-md-6 col-12 mb-4';
            col.innerHTML = `
                <div class="card h-100 shadow-sm" style="border-top:4px solid #7367f0;">
                    <div class="card-header d-flex justify-content-between align-items-center pb-1 pt-3 px-3">
                        <h6 class="mb-0 fw-semibold text-primary">
                            <i class="bx bx-chip me-1"></i>${m.machineName}
                        </h6>
                        <div class="d-flex align-items-center gap-2">
                            ${statusIcon}
                            <div class="dropdown">
                                <button class="btn btn-sm p-0 ms-1" data-bs-toggle="dropdown">
                                    <i class="bx bx-dots-vertical-rounded"></i>
                                </button>
                                <div class="dropdown-menu dropdown-menu-end">
                                    <a class="dropdown-item"
                                       href="MachineOverview.html?machineId=${m.machineId}"
                                       onclick="localStorage.setItem('machineId','${m.machineId}')">
                                        <i class="bx bx-show me-1"></i>View Details
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-body px-3 pt-2">
                        <!-- Performance -->
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <small class="text-muted fw-semibold">PERFORMANCE</small>
                                <span class="badge ${perfClass}">
                                    <i class="${perfIcon} me-1"></i>${perfLabel}
                                </span>
                            </div>
                            <small class="text-muted">${perfText}</small>
                        </div>
                        <hr class="my-2" />
                        <!-- Stats row -->
                        <div class="row text-center g-0">
                            <div class="col-6 border-end">
                                <div class="py-2">
                                    <div class="text-muted small mb-1">Hourly Production</div>
                                    <h4 class="mb-0 fw-bold text-primary">${hp}</h4>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="py-2">
                                    <div class="text-muted small mb-1">Power Usage</div>
                                    <h4 class="mb-0 fw-bold text-warning">${pwr} <small class="fs-6">kWh</small></h4>
                                </div>
                            </div>
                        </div>
                        ${alertHtml}
                    </div>
                    <div class="card-footer px-3 py-2">
                        <a href="MachineOverview.html?machineId=${m.machineId}"
                           class="btn btn-sm btn-outline-primary w-100"
                           onclick="localStorage.setItem('machineId','${m.machineId}')">
                            <i class="bx bx-line-chart me-1"></i>View Dashboard
                        </a>
                    </div>
                </div>`;
            container.appendChild(col);
        });

    } catch (err) {
        spinner.classList.add('d-none');
        container.innerHTML = `
            <div class="col-12">
                <div class="alert alert-danger">
                    <i class="bx bx-error me-2"></i>
                    Failed to load machines: <strong>${err.message}</strong>
                </div>
            </div>`;
    }
}
</script>

</body>
</html>
