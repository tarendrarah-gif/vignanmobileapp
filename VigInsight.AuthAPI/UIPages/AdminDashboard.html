    <script>
    // ── Auth guard ───────────────────────────────────────────────────────────────
    (function () {
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        if (!user) { window.location.href = 'index.html'; return; }
        const role = (user.role || user.roleName || '').toLowerCase();
        if (role !== 'admin') { window.location.href = 'ClientDashboard.html'; }
    })();

    // ── Populate navbar user info from localStorage ──────────────────────────────
    document.addEventListener('DOMContentLoaded', function () {
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const displayName = user.username || 'Admin';
        const displayRole = user.role || user.roleName || 'Admin';

        // Update all name/role placeholders in the navbar dropdown
        document.querySelectorAll('.navbar-username').forEach(el => el.textContent = displayName);
        document.querySelectorAll('.navbar-role').forEach(el => el.textContent = displayRole);
    });
    </script>
